name: Publish Swift Bindings
on:
  workflow_dispatch:
    inputs:
      lwk_version:
        description: 'LWK repo release (bindings_MAJOR.MINOR.PATCH)'
        required: true
        type: string
        default: 'master'
      tag_version:
        description: 'Tag to build (MAJOR.MINOR.PATCH)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-tag-release:
    name: Build, tag, and release the LWK SDK Swift bindings
    runs-on: macos-15
    steps:
      - name: Validate inputs
        env:
          TAG_VERSION: ${{ inputs.tag_version }}
          LWK_VERSION: ${{ inputs.lwk_version }}
        run: |
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag_version must match MAJOR.MINOR.PATCH (got '$TAG_VERSION')"
            exit 1
          fi
          if ! [[ "$LWK_VERSION" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "::error::lwk_version contains invalid characters (got '$LWK_VERSION')"
            exit 1
          fi
      - name: Set release version
        env:
          TAG_VERSION: ${{ inputs.tag_version }}
        run: |
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
      - name: Version
        run: |
          echo "New tag: ${VERSION}"
      - name: Record runner image
        run: |
          echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"
      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
        with:
          targets: x86_64-apple-ios,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.5.0  # optional semver specification, otherwise latest
      - name: Install XcodeGen
        run: brew install https://raw.githubusercontent.com/Homebrew/homebrew-core/005005ff7c057f713d52db5e16e5a8913cc79c4c/Formula/x/xcodegen.rb # 2.46.0
      - name: Checkout lwk-swift repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Blockstream/lwk-swift
          ref: main
      - name: Checkout lwk repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Blockstream/lwk
          ref: ${{ inputs.lwk_version }}
          path: build
      - name: Record resolved lwk commit
        working-directory: build
        run: |
          echo "LWK_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Add MARKETING_VERSION to project.yml
        working-directory: build/lwk_bindings/swift
        run: |
          brew install https://raw.githubusercontent.com/Homebrew/homebrew-core/005005ff7c057f713d52db5e16e5a8913cc79c4c/Formula/y/yq.rb # 4.53.3
          yq e '.targets.lwkFFI.settings.MARKETING_VERSION = env(VERSION)' -i project.yml
          yq e '.targets.lwkFFI.settings.CURRENT_PROJECT_VERSION = "1"' -i project.yml
      - name: Build Swift bindings
        working-directory: build
        run: just swift
      - name: Compress XCFramework
        working-directory: build
        run: |
          cd target
          zip -9 -r lwkFFI.xcframework.zip lwkFFI.xcframework
          echo "XCF_CHECKSUM=`swift package compute-checksum lwkFFI.xcframework.zip`" >> $GITHUB_ENV
      - name: Checksum
        run: |
          echo "XCF_CHECKSUM: ${XCF_CHECKSUM}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "build/target/lwkFFI.xcframework.zip"
      - name: Create package files from templates
        run: |
          envsubst <templates/lwkFFI.podspec >lwkFFI.podspec
          envsubst <templates/LiquidWalletKit.podspec >LiquidWalletKit.podspec
          envsubst <templates/Package.swift >Package.swift
      - name: Copy sources
        run: |
          cp build/target/swift/lwk.swift Sources/LiquidWalletKit/LiquidWalletKit.swift
      - name: Tag the Swift bindings
        run: |
          git add Package.swift Sources lwkFFI.podspec LiquidWalletKit.podspec
          git commit -m "Bump Liquid Wallet Kit to version ${VERSION}"
          git tag "${VERSION}" -m "${VERSION}"
          git push
          git push --tags
      - name: Release and attach XCFramework binary artifact
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "build/target/lwkFFI.xcframework.zip"
          tag: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.VERSION }}
          prerelease: false
          body: |
            Built from Blockstream/lwk@${{ env.LWK_COMMIT }}
            XCFramework checksum (`swift package compute-checksum`): `${{ env.XCF_CHECKSUM }}`
            Runner image: ${{ env.RUNNER_IMAGE }}
            Build provenance attestation: https://github.com/${{ github.repository }}/attestations
      - name: Push update to Cocoapods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{secrets.COCOAPODS_TRUNK_TOKEN}}
        run: |
          pod trunk push lwkFFI.podspec --allow-warnings
          pod trunk push LiquidWalletKit.podspec --allow-warnings --synchronous
